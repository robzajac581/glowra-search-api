name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Unit tests only: DB and Google are stubbed in the tests.
      # The photo-refresh job aborts on an empty key, so give it a fake one.
      - run: npm test
        env:
          DISABLE_SCHEDULED_JOBS: "true"
          GOOGLE_PLACES_API_KEY: "ci-fake-key-not-real"
